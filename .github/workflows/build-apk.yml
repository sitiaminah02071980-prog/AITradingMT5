name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Setup Android SDK
        uses: crazy-max/ghaction-android-sdk@v3
        with:
          sdk-path: $HOME/android-sdk
          api-levels: "34"
          build-tools: "34.0.0"
          platforms: "android-34"
          cmdline-tools: "latest"
          accept-licenses: true
        env:
          ANDROID_HOME: $HOME/android-sdk

      - name: Install Gradle
        run: |
          GRADLE_VERSION=8.2.0
          wget -q https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip
          unzip -q gradle-${GRADLE_VERSION}-bin.zip
          echo "GRADLE_HOME=$PWD/gradle-${GRADLE_VERSION}" >> $GITHUB_ENV
          echo "$PWD/gradle-${GRADLE_VERSION}/bin" >> $GITHUB_PATH

      - name: Build APK
        working-directory: android_app
        run: gradle assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android_app/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
