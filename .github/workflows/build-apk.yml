name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Setup Android SDK
        run: |
          set -e
          SDK_DIR=$HOME/android-sdk
          mkdir -p $SDK_DIR/cmdline-tools
          cd $SDK_DIR/cmdline-tools

          # Ensure unzip is available
          if ! command -v unzip &> /dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y -qq unzip
          fi

          # Download command line tools
          curl -fSL -o cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          echo "=== Downloaded file ==="
          file cmdline-tools.zip
          ls -la cmdline-tools.zip

          # Extract
          echo "=== Extracting ==="
          unzip -o cmdline-tools.zip

          echo "=== Directory structure ==="
          find $SDK_DIR -maxdepth 5 -type d | sort

          echo "=== Looking for sdkmanager ==="
          find $SDK_DIR -name sdkmanager -type f

          # Locate sdkmanager directory
          SDK_BIN=""
          if [ -f $SDK_DIR/cmdline-tools/bin/sdkmanager ]; then
            SDK_BIN=$SDK_DIR/cmdline-tools/bin
          elif [ -f $SDK_DIR/cmdline-tools/cmdline-tools/bin/sdkmanager ]; then
            mv $SDK_DIR/cmdline-tools/cmdline-tools/* $SDK_DIR/cmdline-tools/
            rmdir $SDK_DIR/cmdline-tools/cmdline-tools
            SDK_BIN=$SDK_DIR/cmdline-tools/bin
          else
            SDK_BIN=$(find $SDK_DIR -name sdkmanager -type f | head -1 | xargs dirname)
          fi

          if [ -z "$SDK_BIN" ]; then
            echo "ERROR: sdkmanager not found!"
            exit 1
          fi

          echo "=== SDK bin dir: $SDK_BIN ==="
          echo "ANDROID_HOME=$SDK_DIR" >> $GITHUB_ENV
          echo "$SDK_BIN" >> $GITHUB_PATH

          chmod +x $SDK_BIN/sdkmanager

          echo "=== Accepting licenses ==="
          yes | sdkmanager --licenses

          echo "=== Installing packages ==="
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Install Gradle
        run: |
          GRADLE_VER=8.2.0
          wget -q https://services.gradle.org/distributions/gradle-$GRADLE_VER-bin.zip
          unzip -q gradle-$GRADLE_VER-bin.zip
          echo "GRADLE_HOME=$PWD/gradle-$GRADLE_VER" >> $GITHUB_ENV
          echo "$PWD/gradle-$GRADLE_VER/bin" >> $GITHUB_PATH

      - name: Build APK
        working-directory: android_app
        run: gradle assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android_app/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30