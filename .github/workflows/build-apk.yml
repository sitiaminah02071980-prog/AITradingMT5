name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Setup Android SDK
        run: |
          SDK_DIR=$HOME/android-sdk
          mkdir -p $SDK_DIR
          cd $SDK_DIR
          sudo apt-get update -qq && sudo apt-get install -y -qq wget unzip
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -o commandlinetools-linux-11076708_latest.zip -d $SDK_DIR

          # Find sdkmanager (handles any directory structure)
          SDKMANAGER_PATH=$(find $SDK_DIR -name sdkmanager -type f | head -1)
          if [ -z "$SDKMANAGER_PATH" ]; then
            echo "ERROR: sdkmanager not found in $SDK_DIR"
            find $SDK_DIR -type f -name "*.bat" -o -name "*.sh" -o -name "sdkmanager*" 2>/dev/null | head -20
            exit 1
          fi
          SDK_BIN=$(dirname "$SDKMANAGER_PATH")

          echo "ANDROID_HOME=$SDK_DIR" >> $GITHUB_ENV
          echo "$SDK_BIN" >> $GITHUB_PATH

          chmod +x "$SDKMANAGER_PATH"

          # Accept licenses
          yes | "$SDKMANAGER_PATH" --licenses

          # Install packages
          "$SDKMANAGER_PATH" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Install Gradle
        run: |
          GRADLE_VER=8.2.0
          wget -q https://services.gradle.org/distributions/gradle-$GRADLE_VER-bin.zip
          unzip -q gradle-$GRADLE_VER-bin.zip
          echo "GRADLE_HOME=$PWD/gradle-$GRADLE_VER" >> $GITHUB_ENV
          echo "$PWD/gradle-$GRADLE_VER/bin" >> $GITHUB_PATH

      - name: Build APK
        working-directory: android_app
        run: gradle assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android_app/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30